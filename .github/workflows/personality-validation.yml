name: Validate Soryuka personality
on:
  pull_request:
    paths:
      - "character/**"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/personality-validation.yml"
  push:
    branches: [main]
    paths:
      - "character/**"
      - "tests/**"
      - ".github/workflows/personality-validation.yml"
permissions:
  contents: read
jobs:
  personality:
    name: Personality contract — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate persona configuration
        run: python character/living_personality_runtime.py

name: Validate Soryuka personality
on:
  pull_request:
    paths:
      - "character/**"
      - "core/**"
      - "ui/**"
      - "docs/**"
      - "tests/**"
      - "launch.py"
      - "START-SORYUKA.bat"
      - ".github/workflows/personality-validation.yml"
  push:
    branches: [main]
    paths:
      - "character/**"
      - "core/**"
      - "ui/**"
      - "tests/**"
      - "launch.py"
      - "START-SORYUKA.bat"
      - ".github/workflows/personality-validation.yml"
permissions:
  contents: read
jobs:
  personality:
    name: Soryuka runtime — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned local 3D frontend dependencies
        run: npm install --prefix ui --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Validate Python syntax
        run: python -m compileall -q core character tests launch.py
      - name: Run Python unit and API integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate complete persona canon
        run: python character/living_personality_runtime.py
      - name: Validate Node frontend syntax
        run: |
          node --check ui/server.mjs
          node --check ui/app.js
          node --check ui/mirror-boot.js
          node --check ui/mirror-original.js
          node --check ui/graph-logic.js
          node --check ui/graphics-settings.js
      - name: Test graph logic and graphics settings
        run: node --test ui/graphics-settings.test.mjs ui/graph-logic.test.mjs

  browser-smoke:
    name: WebGL browser smoke — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dev-only browser test dependencies
        run: npm install --prefix ui --include=dev --ignore-scripts --no-audit --no-fund
      - name: Install Chromium with Linux OS dependencies
        if: runner.os == 'Linux'
        run: npx --prefix ui playwright install --with-deps chromium
      - name: Install Chromium for Windows
        if: runner.os == 'Windows'
        run: npx --prefix ui playwright install chromium
      - name: Real WebGL render, controls, SQLite persistence and failure fallback
        run: node ui/browser-smoke.mjs
      - name: Upload visual WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soryuka-webgl-${{ matrix.os }}
          path: artifacts/*.png
          if-no-files-found: ignore
